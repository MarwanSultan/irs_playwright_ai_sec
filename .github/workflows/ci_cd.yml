name: CI-CD DevSecOps Pipeline (Playwright + AI + Security)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  id-token: write

env:
  NODE_VERSION: 20
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:

# =========================
# 1. BUILD & INSTALL
# =========================
  build:
    name: Build & Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build || echo "No build step defined"

# =========================
# 2. SECRET SCANNING (SCA-lite)
# =========================
  secrets_scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
# 3. SAST (Static Security Analysis)
# =========================
  sast_codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze Code
        uses: github/codeql-action/analyze@v3

# =========================
# 4. SAST (Fast Scanner - Semgrep)
# =========================
  sast_semgrep:
    name: SAST - Semgrep Policy Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (OWASP + Custom Rules)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

# =========================
# 5. DEPENDENCY & SUPPLY CHAIN SECURITY
# =========================
  dependency_scan:
    name: Dependency & Supply Chain Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive .

# =========================
# 6. UNIT + API + PLAYWRIGHT TESTS
# =========================
  test:
    name: Playwright Test Execution
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

# =========================
# 7. DAST (Dynamic Security Testing - OWASP ZAP)
# =========================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: https://example.com
          rules_file_name: ".zap/rules.tsv"
          fail_action: true

# =========================
# 8. CONTAINER SECURITY (OPTIONAL EXTENSION)
# =========================
  container_security:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t playwright-ai-sec .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: playwright-ai-sec
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

# =========================
# 9. PIPELINE GATE (FAIL FAST SECURITY ENFORCEMENT)
# =========================
  security_gate:
    name: Security Gate (Policy Enforcement)
    runs-on: ubuntu-latest
    needs:
      - secrets_scan
      - sast_codeql
      - sast_semgrep
      - dependency_scan
      - dast

    steps:
      - name: Validate Security Status
        run: echo "All security checks passed. Pipeline approved for merge/deploy."